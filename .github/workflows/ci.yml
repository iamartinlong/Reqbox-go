name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go run github.com/egoist/mygo/cmd/mygo vet .

      - name: Test
        run: go test ./...

      - name: Package smoke build (unsigned)
        run: go run github.com/egoist/mygo/cmd/mygo build -skip-installer
